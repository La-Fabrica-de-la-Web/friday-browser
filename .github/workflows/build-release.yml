name: Friday Browser - Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0a)'
        required: true
        default: '1.0.0a'
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows'
        type: boolean
        default: false
      build_macos:
        description: 'Build macOS'
        type: boolean
        default: false

env:
  FIREFOX_VERSION: "147.0.3"

jobs:
  build-linux:
    if: ${{ inputs.build_linux }}
    runs-on: [self-hosted, linux, x64, friday-build]
    timeout-minutes: 180
    env:
      HOME: /root
    defaults:
      run:
        shell: bash
        working-directory: /root/navegador/core
    steps:
      - name: Use existing build environment
        working-directory: /root
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          echo "=== Environment ==="
          echo "Node: $(node --version)"
          echo "Rust: $(rustc --version)"
          echo "NPM: $(npm --version)"
          echo "=== Workspace ==="
          echo "Dir: $(pwd)"
          ls -la /root/navegador/core/
          echo "=== Engine check ==="
          if [ -d "/root/navegador/core/engine" ]; then
            echo "Engine exists: $(du -sh /root/navegador/core/engine | cut -f1)"
            echo "zen-static-prefs.inc: $(ls /root/navegador/core/engine/modules/libpref/init/zen-static-prefs.inc 2>&1)"
          else
            echo "Engine NOT found - will need to download"
          fi

      - name: Sync repo changes
        working-directory: /root/navegador/core
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh"
          echo "=== Pull latest from GitHub ==="
          git fetch origin navegador/main
          git reset --hard origin/navegador/main
          echo "=== Current commit ==="
          git log --oneline -1

      - name: Prepare engine (download + import if needed)
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          if [ ! -f "engine/modules/libpref/init/zen-static-prefs.inc" ]; then
            echo "Engine not ready - running full setup..."
            npm install
            npx surfer download
            npx surfer import
            npx surfer bootstrap
          else
            echo "Engine already prepared, checking patches..."
            npm install
            # Re-import to ensure patches are current
            npx surfer import || echo "Import had issues, continuing..."
          fi
          echo "=== Verify ==="
          ls engine/modules/libpref/init/zen-static-prefs.inc

      - name: Build Friday Browser
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          echo "Starting build at $(date)..."
          npx surfer build
          echo "Build completed at $(date)!"
        timeout-minutes: 120

      - name: Package tarball
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh"
          VERSION="${{ inputs.version }}"
          DIST="engine/obj-x86_64-pc-linux-gnu/dist"
          TARBALL="friday-browser-${VERSION}-linux-x86_64.tar.gz"

          if [ ! -d "$DIST" ]; then
            echo "ERROR: dist directory not found at $DIST"
            ls -la engine/obj-*/dist/ 2>/dev/null || echo "No obj dirs found"
            exit 1
          fi

          tar -czf "/tmp/$TARBALL" -C "$DIST" .
          ls -lh "/tmp/$TARBALL"
          echo "TARBALL=/tmp/$TARBALL" >> $GITHUB_ENV
          echo "TARBALL_NAME=$TARBALL" >> $GITHUB_ENV

          # Also copy to web downloads
          cp "/tmp/$TARBALL" /var/www/browser/downloads/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: friday-linux-x86_64
          path: /tmp/friday-browser-${{ inputs.version }}-linux-x86_64.tar.gz

  create-release:
    needs: [build-linux]
    if: always() && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f -ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Friday Browser v${{ inputs.version }}
          draft: true
          prerelease: true
          files: artifacts/**/*
          body: |
            ## Friday Browser v${{ inputs.version }}

            Based on Firefox/Gecko 147.0.3

            ### Downloads
            - **Linux x86_64**: `.tar.gz` — extract and run `./friday`

            ### Notes
            Alpha release for testing.
