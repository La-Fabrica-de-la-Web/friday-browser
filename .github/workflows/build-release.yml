name: Friday Browser - Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0a)'
        required: true
        default: '1.0.0a'
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows (cross-compile)'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS (GitHub cloud)'
        type: boolean
        default: true

env:
  FIREFOX_VERSION: "147.0.3"

jobs:
  # ════════════════════════════════════════
  # LINUX (self-hosted, persistent workdir)
  # ════════════════════════════════════════
  build-linux:
    if: ${{ inputs.build_linux }}
    runs-on: [self-hosted, linux, x64, friday-build]
    timeout-minutes: 180
    env:
      HOME: /root
    defaults:
      run:
        shell: bash
        working-directory: /root/navegador/core
    steps:
      - name: Environment check
        working-directory: /root
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          echo "Node: $(node --version) | Rust: $(rustc --version) | NPM: $(npm --version)"
          ls /root/navegador/core/engine/modules/libpref/init/zen-static-prefs.inc && echo "Engine: ready"

      - name: Sync repo
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh"
          git fetch origin navegador/main && git reset --hard origin/navegador/main
          git log --oneline -1

      - name: Prepare engine
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          npm install
          npx surfer import || true
          ls engine/modules/libpref/init/zen-static-prefs.inc

      - name: Build
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          npx surfer build
        timeout-minutes: 120

      - name: Package
        run: |
          VERSION="${{ inputs.version }}"
          DIST="engine/obj-x86_64-pc-linux-gnu/dist"
          TARBALL="friday-browser-${VERSION}-linux-x86_64.tar.gz"
          tar -czf "/tmp/$TARBALL" -C "$DIST" .
          ls -lh "/tmp/$TARBALL"
          cp "/tmp/$TARBALL" /var/www/browser/downloads/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: friday-linux-x86_64
          path: /tmp/friday-browser-${{ inputs.version }}-linux-x86_64.tar.gz

  # ════════════════════════════════════════
  # WINDOWS (self-hosted, cross-compile)
  # ════════════════════════════════════════
  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: [self-hosted, linux, x64, friday-build]
    timeout-minutes: 180
    env:
      HOME: /root
    defaults:
      run:
        shell: bash
        working-directory: /root/navegador/core
    steps:
      - name: Environment check
        working-directory: /root
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          echo "Node: $(node --version) | Rust: $(rustc --version)"
          echo "Wine: $(/root/win-cross/wine/bin/wine64 --version 2>/dev/null || echo 'not found')"
          echo "VS2022 MSVC: $(ls /root/win-cross/vs2022/VC/Tools/MSVC/)"
          echo "Windows SDK: $(ls /root/win-cross/vs2022/Windows\ Kits/10/Lib/)"
          ls /root/navegador/core/engine/windows-0.62.2/ > /dev/null && echo "windows-rs 0.62.2: ready"
          ls /root/.mozbuild/clang/lib/clang/20/lib/windows/ > /dev/null && echo "Clang windows libs: ready"
          rustup target list --installed | grep -q x86_64-pc-windows-msvc || rustup target add x86_64-pc-windows-msvc

      - name: Sync repo
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh"
          git fetch origin navegador/main && git reset --hard origin/navegador/main
          git log --oneline -1

      - name: Clean Windows obj
        run: |
          rm -rf engine/obj-x86_64-pc-windows-msvc 2>/dev/null || true
          echo "Cleaned previous Windows build objects"

      - name: Prepare engine
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          npm install
          export SURFER_COMPAT=x86_64
          npx surfer import || true

      - name: Build for Windows
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          export ZEN_CROSS_COMPILING=1
          export SURFER_PLATFORM=win32
          export SURFER_COMPAT=x86_64
          export ZEN_GA_DISABLE_PGO=1
          export LIB="/root/.mozbuild/clang/lib/clang/20/lib/windows"
          export MOZ_WINDOWS_RS_DIR="/root/navegador/core/engine/windows-0.62.2"
          export ZEN_RELEASE=1
          ulimit -n 4096
          npx surfer build
        timeout-minutes: 120

      - name: Package
        run: |
          VERSION="${{ inputs.version }}"
          DIST="engine/obj-x86_64-pc-windows-msvc/dist"
          TARBALL="friday-browser-${VERSION}-windows-x86_64.tar.gz"
          if [ -d "$DIST" ]; then
            tar -czf "/tmp/$TARBALL" -C "$DIST" .
            ls -lh "/tmp/$TARBALL"
          else
            echo "Build output directory not found: $DIST"
            ls engine/obj-*/dist/ 2>/dev/null || echo "No dist directories found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: friday-windows-x86_64
          path: /tmp/friday-browser-${{ inputs.version }}-windows-x86_64.tar.gz

  # ════════════════════════════════════════
  # macOS (GitHub cloud, macos-26 runner)
  # ════════════════════════════════════════
  build-macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Setup Git
        run: |
          git config --global user.email "ci@fridaybrowser.app"
          git config --global user.name "Friday CI"

      - name: Install system dependencies
        run: |
          brew update
          brew install cairo gnu-tar mercurial
          sudo pip install setuptools
          brew uninstall --ignore-dependencies python3.12 -f || true

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(cat .rust-toolchain)
          source $HOME/.cargo/env
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install + Download + Import + Bootstrap
        env:
          SURFER_COMPAT: aarch64
        run: |
          source $HOME/.cargo/env
          npm ci
          npm run download
          npm run import -- --verbose || true
          cd engine
          export SURFER_PLATFORM="darwin"
          ./mach --no-interactive bootstrap --application-choice browser || true
          cd ..

      - name: Build
        env:
          SURFER_PLATFORM: darwin
          SURFER_COMPAT: aarch64
          ZEN_GA_DISABLE_PGO: "1"
        run: |
          source $HOME/.cargo/env
          ulimit -n 4096
          export ZEN_RELEASE=1
          npm run build
        timeout-minutes: 180

      - name: Package
        run: |
          VERSION="${{ inputs.version }}"
          DIST="engine/obj-aarch64-apple-darwin/dist"
          TARBALL="friday-browser-${VERSION}-macos-aarch64.tar.gz"
          if [ -d "$DIST" ]; then
            tar -czf "/tmp/$TARBALL" -C "$DIST" .
            ls -lh "/tmp/$TARBALL"
          else
            echo "Build output not found at $DIST"
            find engine/obj-* -name "dist" -type d 2>/dev/null || echo "No dist dirs"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: friday-macos-aarch64
          path: /tmp/friday-browser-${{ inputs.version }}-macos-aarch64.tar.gz

  # ════════════════════════════════════════
  # RELEASE
  # ════════════════════════════════════════
  create-release:
    needs: [build-linux, build-windows, build-macos]
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Friday Browser v${{ inputs.version }}
          draft: true
          files: artifacts/**/*
