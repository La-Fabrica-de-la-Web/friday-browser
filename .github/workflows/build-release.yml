name: Friday Browser - Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0a)'
        required: true
        default: '1.0.0a'
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows (cross-compile from Linux)'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS (uses GitHub cloud runner)'
        type: boolean
        default: false

env:
  NODE_VERSION: "20"
  FIREFOX_VERSION: "147.0.3"
  NVM_SETUP: 'export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"'

jobs:
  # ════════════════════════════════════════
  # LINUX BUILD (self-hosted on Hetzner)
  # ════════════════════════════════════════
  build-linux:
    if: ${{ inputs.build_linux }}
    runs-on: [self-hosted, linux, x64, friday-build]
    timeout-minutes: 180
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          echo "Node: $(node --version)"
          echo "Rust: $(rustc --version)"
          echo "Home: $HOME"
          echo "NVM: $NVM_DIR"

      - name: Install deps + download + import + bootstrap
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          npm install
          npx surfer download
          npx surfer import
          npx surfer bootstrap

      - name: Build
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          npx surfer build
        timeout-minutes: 120

      - name: Package
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          VERSION="${{ inputs.version }}"
          DIST="engine/obj-x86_64-pc-linux-gnu/dist"
          TARBALL="friday-browser-${VERSION}-linux-x86_64.tar.gz"
          tar -czf "$TARBALL" -C "$DIST" .
          echo "TARBALL=$TARBALL" >> $GITHUB_ENV
          ls -lh "$TARBALL"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: friday-linux-x86_64
          path: ${{ env.TARBALL }}

  # ════════════════════════════════════════
  # WINDOWS BUILD (cross-compile from Linux)
  # ════════════════════════════════════════
  build-windows:
    if: ${{ inputs.build_windows }}
    needs: build-linux
    runs-on: [self-hosted, linux, x64, friday-build]
    timeout-minutes: 180
    env:
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup cross-compile
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          echo "Node: $(node --version)"
          echo "Setting up Windows cross-compilation..."
          # Check if wine/mingw are available
          which x86_64-w64-mingw32-gcc 2>/dev/null && echo "mingw: OK" || echo "mingw: NOT FOUND"
          which wine 2>/dev/null && echo "wine: OK" || echo "wine: NOT FOUND"

      - name: Build for Windows
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          npm install
          npx surfer download
          npx surfer import
          # Set cross-compile target
          export MOZ_CROSS_COMPILE=1
          export CROSS_COMPILE_TARGET=x86_64-pc-mingw32
          npx surfer bootstrap --target x86_64-pc-mingw32 || echo "Cross-compile bootstrap failed, skipping Windows build"
        timeout-minutes: 120

  # ════════════════════════════════════════
  # macOS BUILD (GitHub cloud runner)
  # ════════════════════════════════════════
  build-macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup macOS build env
        run: |
          brew install node@20 rust mercurial
          echo "Node: $(node --version)"
          echo "Rust: $(rustc --version)"

      - name: Build for macOS
        run: |
          npm install
          npx surfer download
          npx surfer import
          npx surfer bootstrap
          npx surfer build
        timeout-minutes: 120

      - name: Package DMG
        run: |
          VERSION="${{ inputs.version }}"
          echo "Creating DMG for macOS ARM64..."
          # TODO: Create proper DMG with create-dmg
          DIST="engine/obj-aarch64-apple-darwin/dist"
          DMG="friday-browser-${VERSION}-macos-arm64.dmg"
          hdiutil create -volname "Friday Browser" -srcfolder "$DIST" -ov -format UDZO "$DMG" || echo "DMG creation skipped"
          echo "DMG=$DMG" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: friday-macos-arm64
          path: "*.dmg"

  # ════════════════════════════════════════
  # CREATE RELEASE
  # ════════════════════════════════════════
  create-release:
    needs: [build-linux, build-windows, build-macos]
    if: always() && (needs.build-linux.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Friday Browser v${{ inputs.version }}
          draft: true
          prerelease: true
          files: artifacts/**/*
          body: |
            ## Friday Browser v${{ inputs.version }}

            Based on Firefox/Gecko ${{ env.FIREFOX_VERSION }}

            ### Downloads
            - **Linux x86_64**: `.tar.gz`
            - **macOS ARM64**: `.dmg` (unsigned — right-click → Open)
            - **Windows x86_64**: Coming soon

            ### Notes
            Alpha release. For testing purposes.
