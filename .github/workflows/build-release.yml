name: Friday Browser - Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0a)'
        required: true
        default: '1.0.0a'
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows (cross-compile)'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS (GitHub cloud)'
        type: boolean
        default: true

env:
  FIREFOX_VERSION: "147.0.3"

jobs:
  # ════════════════════════════════════════
  # LINUX (self-hosted, persistent workdir)
  # ════════════════════════════════════════
  build-linux:
    if: ${{ inputs.build_linux }}
    runs-on: [self-hosted, linux, x64, friday-build]
    timeout-minutes: 180
    env:
      HOME: /root
    defaults:
      run:
        shell: bash
        working-directory: /root/navegador/core
    steps:
      - name: Environment check
        working-directory: /root
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          echo "Node: $(node --version) | Rust: $(rustc --version) | NPM: $(npm --version)"
          ls /root/navegador/core/engine/modules/libpref/init/zen-static-prefs.inc && echo "Engine: ready"

      - name: Sync repo
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh"
          git fetch origin navegador/main && git reset --hard origin/navegador/main
          git log --oneline -1

      - name: Prepare engine
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          npm install
          npx surfer import || true
          ls engine/modules/libpref/init/zen-static-prefs.inc

      - name: Build
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          npx surfer build
        timeout-minutes: 120

      - name: Package
        run: |
          VERSION="${{ inputs.version }}"
          DIST="engine/obj-x86_64-pc-linux-gnu/dist"
          TARBALL="friday-browser-${VERSION}-linux-x86_64.tar.gz"
          tar -czf "/tmp/$TARBALL" -C "$DIST" .
          ls -lh "/tmp/$TARBALL"
          cp "/tmp/$TARBALL" /var/www/browser/downloads/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: friday-linux-x86_64
          path: /tmp/friday-browser-${{ inputs.version }}-linux-x86_64.tar.gz

  # ════════════════════════════════════════
  # WINDOWS (self-hosted, cross-compile)
  # ════════════════════════════════════════
  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: [self-hosted, linux, x64, friday-build]
    timeout-minutes: 240
    env:
      HOME: /root
    defaults:
      run:
        shell: bash
        working-directory: /root/navegador/core
    steps:
      - name: Environment check
        working-directory: /root
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          echo "Node: $(node --version) | Rust: $(rustc --version)"
          echo "Wine: $(ls /root/win-cross/wine/bin/wine 2>&1)"
          echo "VS2022: $(ls /root/win-cross/vs2022/VC/ 2>&1 | head -3)"
          rustup target list --installed | grep windows && echo "Rust Windows target: OK"

      - name: Sync repo
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh"
          git fetch origin navegador/main && git reset --hard origin/navegador/main
          git log --oneline -1

      - name: Prepare engine for Windows
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          export SURFER_COMPAT=x86_64
          npm install
          npx surfer import --verbose || true
          dos2unix configs/windows/mozconfig 2>/dev/null || true

      - name: Bootstrap for Windows
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          export SURFER_PLATFORM="win32"
          chmod -R +x ~/win-cross/vs2022 2>/dev/null || true
          npx surfer bootstrap || true

      - name: Build for Windows
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          export SURFER_PLATFORM="win32"
          export SURFER_COMPAT="x86_64"
          export ZEN_CROSS_COMPILING=1
          export ZEN_RELEASE=1
          export ZEN_GA_DISABLE_PGO=1
          CLANG_VER=$(ls /root/.mozbuild/clang/lib/clang/)
          export LIB="/root/.mozbuild/clang/lib/clang/$CLANG_VER/lib/windows"
          WINDOWS_RS_VERSION=$(cat build/windows/.windows-rs-version)
          export MOZ_WINDOWS_RS_DIR="/root/navegador/core/engine/windows-$WINDOWS_RS_VERSION"
          ulimit -n 4096
          npm run build
        timeout-minutes: 180

      - name: Package Windows
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          export SURFER_PLATFORM="win32"
          export SURFER_COMPAT="x86_64"
          export ZEN_CROSS_COMPILING=1
          export ZEN_RELEASE=1
          npm run package || true
          VERSION="${{ inputs.version }}"
          # Zen packages as .zip, rename for our release
          if ls dist/*.zip 1>/dev/null 2>&1; then
            mv dist/*.zip "/tmp/friday-browser-${VERSION}-windows-x86_64.zip"
          elif [ -d "engine/obj-x86_64-pc-windows-msvc/dist" ]; then
            cd engine/obj-x86_64-pc-windows-msvc/dist
            zip -r "/tmp/friday-browser-${VERSION}-windows-x86_64.zip" . -x "*.pdb"
            cd /root/navegador/core
          fi
          # Also grab installer if it exists
          if ls dist/*.exe 1>/dev/null 2>&1; then
            cp dist/*.exe "/tmp/friday-browser-${VERSION}-windows-setup.exe"
          fi
          ls -lh /tmp/friday-browser-${VERSION}-windows-* 2>/dev/null || echo "No Windows artifacts found"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: friday-windows-x86_64
          path: /tmp/friday-browser-${{ inputs.version }}-windows-*

  # ════════════════════════════════════════
  # macOS (GitHub cloud runner)
  # ════════════════════════════════════════
  build-macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system deps
        run: |
          brew update
          brew install cairo gnu-tar mercurial
          echo 'export PATH="/usr/local/opt/gnu-tar/libexec/gnubin:$PATH"' >> ~/.bash_profile
          source ~/.bash_profile 2>/dev/null || true

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(cat .rust-toolchain 2>/dev/null || echo "stable")
          source $HOME/.cargo/env
          rustup target add aarch64-apple-darwin

      - name: Install + Download + Import + Bootstrap
        run: |
          source $HOME/.cargo/env
          npm ci
          npm run download
          export SURFER_COMPAT=aarch64
          npm run import -- --verbose || true
          cd engine
          export SURFER_PLATFORM="darwin"
          ./mach --no-interactive bootstrap --application-choice browser || true
          cd ..
          # Fix SDK path: symlink real SDK to expected paths
          REAL_SDK=$(xcrun --show-sdk-path 2>/dev/null)
          echo "Real SDK: $REAL_SDK"
          ls /Library/Developer/CommandLineTools/SDKs/ 2>/dev/null || true
          # Create symlinks for any SDK version the build might expect
          for expected in MacOSX26.2.sdk MacOSX26.1.sdk MacOSX26.0.sdk MacOSX25.sdk; do
            target="/Library/Developer/CommandLineTools/SDKs/$expected"
            if [ ! -e "$target" ] && [ -n "$REAL_SDK" ]; then
              sudo ln -sf "$REAL_SDK" "$target" 2>/dev/null || true
              echo "Symlinked $expected -> $REAL_SDK"
            fi
          done
          ls -la /Library/Developer/CommandLineTools/SDKs/ 2>/dev/null || true

      - name: Patch SDK version check
        run: |
          # Firefox 147 requires SDK 26.1+ but macos-14 runner has SDK 14.x
          # Patch the min version check to accept older SDKs
          SDK_FILE="engine/build/moz.configure/toolchain.configure"
          echo "Before patch:"
          grep -n "26.1" "$SDK_FILE" || true
          sed -i.bak 's/return "26.1"/return "14.0"/' "$SDK_FILE"
          # Also patch any --with-macos-sdk references to use actual SDK
          REAL_SDK=$(xcrun --show-sdk-path)
          echo "Real SDK path: $REAL_SDK"
          echo "After patch:"
          grep -n "14.0" "$SDK_FILE" | head -3

      - name: Build
        run: |
          source $HOME/.cargo/env
          export SURFER_PLATFORM="darwin"
          export SURFER_COMPAT="aarch64"
          export ZEN_RELEASE=1
          export ZEN_GA_DISABLE_PGO=1
          npm run build
        timeout-minutes: 120

      - name: Package DMG
        run: |
          source $HOME/.cargo/env
          export SURFER_PLATFORM="darwin"
          export SURFER_COMPAT="aarch64"
          export ZEN_RELEASE=1
          export ZEN_GA_DISABLE_PGO=1
          npm run package || true
          VERSION="${{ inputs.version }}"
          if ls dist/*.dmg 1>/dev/null 2>&1; then
            mv dist/*.dmg "friday-browser-${VERSION}-macos-arm64.dmg"
          elif [ -d "engine/obj-aarch64-apple-darwin/dist" ]; then
            hdiutil create -volname "Friday Browser" \
              -srcfolder "engine/obj-aarch64-apple-darwin/dist/Friday Browser.app" \
              -ov -format UDZO "friday-browser-${VERSION}-macos-arm64.dmg" || true
          fi
          ls -lh friday-browser-*.dmg 2>/dev/null || echo "DMG not created"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: friday-macos-arm64
          path: "*.dmg"

  # ════════════════════════════════════════
  # RELEASE
  # ════════════════════════════════════════
  create-release:
    needs: [build-linux, build-windows, build-macos]
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f -ls

      - name: Delete existing release
        run: gh release delete v${{ inputs.version }} --yes --repo ${{ github.repository }} 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delete existing tag
        run: git push --delete origin v${{ inputs.version }} 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Friday Browser v${{ inputs.version }}
          draft: false
          prerelease: true
          files: artifacts/**/*
          body: |
            ## Friday Browser v${{ inputs.version }}

            Based on Firefox/Gecko 147.0.3

            ### Downloads
            | Platform | File | Notes |
            |----------|------|-------|
            | Linux x86_64 | `.tar.gz` | Extract and run `./friday` |
            | Windows x86_64 | `.zip` / `.exe` | Extract or run installer |
            | macOS ARM64 | `.dmg` | Unsigned — right-click → Open |

            ### Notes
            Alpha release for testing.
