name: Friday Browser - Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0a)'
        required: true
        default: '1.0.0a'
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows (cross-compile from Linux)'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS (uses GitHub cloud runner)'
        type: boolean
        default: false

env:
  NODE_VERSION: "20"
  FIREFOX_VERSION: "147.0.3"

jobs:
  # ════════════════════════════════════════
  # LINUX BUILD (self-hosted on Hetzner)
  # ════════════════════════════════════════
  build-linux:
    if: ${{ inputs.build_linux }}
    runs-on: [self-hosted, linux, x64, friday-build]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh"
          source "$HOME/.cargo/env"
          echo "Node: $(node --version)"
          echo "Rust: $(rustc --version)"

      - name: Install deps + download + import + bootstrap
        run: |
          export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh"
          source "$HOME/.cargo/env"
          npm install
          npx surfer download
          npx surfer import
          npx surfer bootstrap

      - name: Build
        run: |
          export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh"
          source "$HOME/.cargo/env"
          npx surfer build

      - name: Package
        run: |
          cd engine/obj-x86_64-pc-linux-gnu/dist
          tar czf $GITHUB_WORKSPACE/friday-browser-${{ inputs.version }}-linux-x86_64.tar.gz \
            --transform='s,^bin,friday-browser,' bin/
          ls -lh $GITHUB_WORKSPACE/friday-browser-*.tar.gz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: friday-browser-linux-x86_64
          path: friday-browser-${{ inputs.version }}-linux-x86_64.tar.gz

  # ════════════════════════════════════════
  # WINDOWS BUILD (cross-compile on Hetzner)
  # ════════════════════════════════════════
  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: [self-hosted, linux, x64, friday-build]
    needs: build-linux
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup cross-compile deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine64 p7zip-full nsis dos2unix

      - name: Setup environment
        run: |
          export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh"
          source "$HOME/.cargo/env"
          rustup target add x86_64-pc-windows-msvc
          echo "Rust Windows target added"

      - name: Install + download + import
        run: |
          export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh"
          source "$HOME/.cargo/env"
          npm install
          npx surfer download
          SURFER_PLATFORM="win32" npx surfer import
          SURFER_PLATFORM="win32" npx surfer bootstrap

      - name: Build Windows
        run: |
          export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh"
          source "$HOME/.cargo/env"
          SURFER_PLATFORM="win32" npx surfer build

      - name: Package
        run: |
          export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh"
          npx surfer package || true
          # Find and rename output
          find . -name "*.exe" -o -name "*.zip" | head -5
          cp engine/obj-*/dist/*.exe $GITHUB_WORKSPACE/friday-browser-${{ inputs.version }}-win-x86_64-setup.exe 2>/dev/null || \
          echo "Windows packaging needs debugging"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: friday-browser-windows-x86_64
          path: friday-browser-${{ inputs.version }}-win-*.exe
          if-no-files-found: warn

  # ════════════════════════════════════════
  # macOS BUILD (GitHub cloud runner)
  # ════════════════════════════════════════
  build-macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-action@v1
        with:
          toolchain: stable

      - name: Install system deps
        run: |
          brew install mercurial

      - name: Install + download + import + bootstrap
        run: |
          npm install
          npx surfer download
          npx surfer import
          npx surfer bootstrap

      - name: Build macOS
        run: |
          npx surfer build

      - name: Package DMG
        run: |
          npx surfer package || true
          # Create a simple .tar.gz if DMG fails
          cd engine/obj-*/dist
          tar czf $GITHUB_WORKSPACE/friday-browser-${{ inputs.version }}-macos-aarch64.tar.gz \
            --transform='s,^*.app,Friday Browser.app,' *.app/ 2>/dev/null || \
          tar czf $GITHUB_WORKSPACE/friday-browser-${{ inputs.version }}-macos-aarch64.tar.gz bin/
          ls -lh $GITHUB_WORKSPACE/friday-browser-*.tar.gz

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: friday-browser-macos-aarch64
          path: |
            friday-browser-${{ inputs.version }}-macos-*.tar.gz
            friday-browser-${{ inputs.version }}-macos-*.dmg
          if-no-files-found: warn

  # ════════════════════════════════════════
  # CREATE RELEASE
  # ════════════════════════════════════════
  create-release:
    needs: [build-linux, build-windows, build-macos]
    if: |
      always() &&
      (needs.build-linux.result == 'success' ||
       needs.build-windows.result == 'success' ||
       needs.build-macos.result == 'success')
    runs-on: [self-hosted, linux, x64, friday-build]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: List artifacts
        run: find ./release-artifacts -type f -ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: "Friday Browser v${{ inputs.version }}"
          body: |
            ## Friday Browser v${{ inputs.version }}

            ### Downloads
            | Platform | File | Status |
            |----------|------|--------|
            | Linux x86_64 | `.tar.gz` | ${{ needs.build-linux.result }} |
            | Windows x86_64 | `.exe` | ${{ needs.build-windows.result }} |
            | macOS ARM64 | `.dmg` / `.tar.gz` | ${{ needs.build-macos.result }} |

            ### Install
            **Linux:**
            ```bash
            tar xzf friday-browser-*-linux-x86_64.tar.gz
            cd friday-browser && ./friday
            ```

            **Windows:** Run the `.exe` installer.

            **macOS (unsigned):**
            Right-click the app → Open → Open again.
            Or: `xattr -cr /Applications/Friday\ Browser.app`

            ---
            Engine: Gecko (Firefox ${{ env.FIREFOX_VERSION }}) | Base: Zen Browser
            *Built on Hetzner self-hosted + GitHub cloud runners*
          files: ./release-artifacts/**/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
