name: Friday Browser - Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0a)'
        required: true
        default: '1.0.0a'
      build_linux:
        description: 'Build Linux'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows (cross-compile)'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS (GitHub cloud)'
        type: boolean
        default: true

env:
  FIREFOX_VERSION: "147.0.3"

jobs:
  # ════════════════════════════════════════
  # LINUX (self-hosted, persistent workdir)
  # ════════════════════════════════════════
  build-linux:
    if: ${{ inputs.build_linux }}
    runs-on: [self-hosted, linux, x64, friday-build]
    timeout-minutes: 180
    env:
      HOME: /root
    defaults:
      run:
        shell: bash
        working-directory: /root/navegador/core
    steps:
      - name: Environment check
        working-directory: /root
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          echo "Node: $(node --version) | Rust: $(rustc --version) | NPM: $(npm --version)"
          ls /root/navegador/core/engine/modules/libpref/init/zen-static-prefs.inc && echo "Engine: ready"

      - name: Sync repo
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh"
          git fetch origin navegador/main && git reset --hard origin/navegador/main
          git log --oneline -1

      - name: Prepare engine
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          npm install
          npx surfer import || true
          ls engine/modules/libpref/init/zen-static-prefs.inc

      - name: Build
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          npx surfer build
        timeout-minutes: 120

      - name: Package
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          cd engine && ./mach package
          echo "=== Package output ==="
          ls -lh obj-x86_64-pc-linux-gnu/dist/friday-*.tar.* 2>/dev/null || true
          # Copy to /tmp with release naming
          VERSION="${{ inputs.version }}"
          PKG=$(ls obj-x86_64-pc-linux-gnu/dist/friday-*.linux-x86_64.tar.* 2>/dev/null | head -1)
          if [ -n "$PKG" ]; then
            EXT="${PKG##*.tar.}"
            cp "$PKG" "/tmp/friday-browser-${VERSION}-linux-x86_64.tar.${EXT}"
            ls -lh "/tmp/friday-browser-${VERSION}-linux-x86_64.tar.${EXT}"
          else
            echo "ERROR: No package found!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: friday-linux-x86_64
          path: /tmp/friday-browser-${{ inputs.version }}-linux-x86_64.tar.*

  # ════════════════════════════════════════
  # WINDOWS (self-hosted, cross-compile)
  # ════════════════════════════════════════
  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: [self-hosted, linux, x64, friday-build]
    timeout-minutes: 180
    env:
      HOME: /root
    defaults:
      run:
        shell: bash
        working-directory: /root/navegador/core
    steps:
      - name: Environment check
        working-directory: /root
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          echo "Node: $(node --version) | Rust: $(rustc --version)"
          echo "Wine: $(/root/win-cross/wine/bin/wine64 --version 2>/dev/null || echo 'not found')"
          echo "VS2022 MSVC: $(ls /root/win-cross/vs2022/VC/Tools/MSVC/)"
          echo "Windows SDK: $(ls /root/win-cross/vs2022/Windows\ Kits/10/Lib/)"
          ls /root/navegador/core/engine/windows-0.62.2/ > /dev/null && echo "windows-rs 0.62.2: ready"
          ls /root/.mozbuild/clang/lib/clang/20/lib/windows/ > /dev/null && echo "Clang windows libs: ready"
          rustup target list --installed | grep -q x86_64-pc-windows-msvc || rustup target add x86_64-pc-windows-msvc

      - name: Sync repo
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh"
          git fetch origin navegador/main && git reset --hard origin/navegador/main
          git log --oneline -1

      - name: Clean Windows obj
        run: |
          rm -rf engine/obj-x86_64-pc-windows-msvc 2>/dev/null || true
          echo "Cleaned previous Windows build objects"

      - name: Prepare engine
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          npm install
          export SURFER_COMPAT=x86_64
          npx surfer import || true

      - name: Build for Windows
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          export ZEN_CROSS_COMPILING=1
          export SURFER_PLATFORM=win32
          export SURFER_COMPAT=x86_64
          export ZEN_GA_DISABLE_PGO=1
          export LIB="/root/.mozbuild/clang/lib/clang/20/lib/windows"
          export MOZ_WINDOWS_RS_DIR="/root/navegador/core/engine/windows-0.62.2"
          export ZEN_RELEASE=1
          ulimit -n 4096
          npx surfer build
        timeout-minutes: 120

      - name: Package
        run: |
          export NVM_DIR="/root/.nvm" && . "/root/.nvm/nvm.sh" && . "/root/.cargo/env"
          export ZEN_CROSS_COMPILING=1
          export SURFER_PLATFORM=win32
          export SURFER_COMPAT=x86_64
          export LIB="/root/.mozbuild/clang/lib/clang/20/lib/windows"
          export MOZ_WINDOWS_RS_DIR="/root/navegador/core/engine/windows-0.62.2"
          cd engine
          export MOZ_OBJDIR=obj-x86_64-pc-windows-msvc
          ./mach package
          echo "=== Package output ==="
          ls -lh obj-x86_64-pc-windows-msvc/dist/friday-*.{zip,exe} 2>/dev/null || true
          ls -lh obj-x86_64-pc-windows-msvc/dist/install/sea/*.exe 2>/dev/null || true
          # Copy to /tmp with release naming
          VERSION="${{ inputs.version }}"
          # ZIP
          ZIP=$(ls obj-x86_64-pc-windows-msvc/dist/friday-*.win64.zip 2>/dev/null | head -1)
          if [ -n "$ZIP" ]; then
            cp "$ZIP" "/tmp/friday-browser-${VERSION}-windows-x86_64.zip"
            ls -lh "/tmp/friday-browser-${VERSION}-windows-x86_64.zip"
          fi
          # Installer
          EXE=$(ls obj-x86_64-pc-windows-msvc/dist/friday-*.win64.installer.exe 2>/dev/null | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" "/tmp/friday-browser-${VERSION}-windows-x86_64-installer.exe"
            ls -lh "/tmp/friday-browser-${VERSION}-windows-x86_64-installer.exe"
          fi
          # Check at least zip exists
          if [ -z "$ZIP" ] && [ -z "$EXE" ]; then
            echo "ERROR: No Windows package found!"
            ls obj-x86_64-pc-windows-msvc/dist/ 2>/dev/null | head -20
            exit 1
          fi

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: friday-windows-x86_64-zip
          path: /tmp/friday-browser-${{ inputs.version }}-windows-x86_64.zip
          if-no-files-found: warn

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: friday-windows-x86_64-installer
          path: /tmp/friday-browser-${{ inputs.version }}-windows-x86_64-installer.exe
          if-no-files-found: warn

  # ════════════════════════════════════════
  # macOS (GitHub cloud, macos-26 runner)
  # ════════════════════════════════════════
  build-macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Setup Git
        run: |
          git config --global user.email "ci@fridaybrowser.app"
          git config --global user.name "Friday CI"

      - name: Install system dependencies
        run: |
          brew update
          brew install cairo gnu-tar mercurial
          sudo pip install setuptools
          brew uninstall --ignore-dependencies python3.12 -f || true

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain $(cat .rust-toolchain)
          source $HOME/.cargo/env
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install + Download + Import + Bootstrap
        env:
          SURFER_COMPAT: aarch64
        run: |
          source $HOME/.cargo/env
          npm ci
          npm run download
          npm run import -- --verbose || true
          cd engine
          export SURFER_PLATFORM="darwin"
          ./mach --no-interactive bootstrap --application-choice browser || true
          cd ..

      - name: Build
        env:
          SURFER_PLATFORM: darwin
          SURFER_COMPAT: aarch64
          ZEN_GA_DISABLE_PGO: "1"
        run: |
          source $HOME/.cargo/env
          ulimit -n 4096
          export ZEN_RELEASE=1
          npm run build
        timeout-minutes: 180

      - name: Package
        env:
          SURFER_PLATFORM: darwin
          SURFER_COMPAT: aarch64
        run: |
          source $HOME/.cargo/env
          cd engine && ./mach package
          echo "=== Package output ==="
          ls -lh obj-aarch64-apple-darwin/dist/friday-*.{dmg,tar.bz2,tar.gz} 2>/dev/null || true
          # Copy to /tmp with release naming
          VERSION="${{ inputs.version }}"
          # Try DMG first, then tar.bz2
          DMG=$(ls obj-aarch64-apple-darwin/dist/friday-*.mac.dmg 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" "/tmp/friday-browser-${VERSION}-macos-aarch64.dmg"
            ls -lh "/tmp/friday-browser-${VERSION}-macos-aarch64.dmg"
          fi
          # Also grab tar.bz2 if it exists
          TAR=$(ls obj-aarch64-apple-darwin/dist/friday-*.mac.tar.bz2 2>/dev/null | head -1)
          if [ -n "$TAR" ]; then
            cp "$TAR" "/tmp/friday-browser-${VERSION}-macos-aarch64.tar.bz2"
            ls -lh "/tmp/friday-browser-${VERSION}-macos-aarch64.tar.bz2"
          fi
          # Fallback: any tar.gz from mach package
          if [ -z "$DMG" ] && [ -z "$TAR" ]; then
            FALLBACK=$(ls obj-aarch64-apple-darwin/dist/friday-*.tar.* 2>/dev/null | head -1)
            if [ -n "$FALLBACK" ]; then
              EXT="${FALLBACK#*.tar.}"
              cp "$FALLBACK" "/tmp/friday-browser-${VERSION}-macos-aarch64.tar.${EXT}"
              ls -lh "/tmp/friday-browser-${VERSION}-macos-aarch64.tar.${EXT}"
            else
              echo "ERROR: No macOS package found!"
              ls obj-aarch64-apple-darwin/dist/ 2>/dev/null | head -20
              exit 1
            fi
          fi

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: friday-macos-aarch64-dmg
          path: /tmp/friday-browser-${{ inputs.version }}-macos-aarch64.dmg
          if-no-files-found: warn

      - name: Upload tar
        uses: actions/upload-artifact@v4
        with:
          name: friday-macos-aarch64-tar
          path: /tmp/friday-browser-${{ inputs.version }}-macos-aarch64.tar.*
          if-no-files-found: warn

  # ════════════════════════════════════════
  # RELEASE
  # ════════════════════════════════════════
  create-release:
    needs: [build-linux, build-windows, build-macos]
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Friday Browser v${{ inputs.version }}
          draft: false
          prerelease: true
          body: |
            ## Friday Browser v${{ inputs.version }}

            Based on Firefox/Gecko ${{ env.FIREFOX_VERSION }}

            ### Downloads
            - **Windows**: `.zip` (portable) or `.exe` (installer)
            - **macOS**: `.dmg` (Apple Silicon)
            - **Linux**: `.tar.xz` (extract and run `./friday`)

            Alpha release for testing.
          files: artifacts/**/*
